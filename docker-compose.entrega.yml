# Compose de entrega: MongoDB, la API y la interfaz web en contenedores,
# arranque en un comando.
#
#   docker compose -f docker-compose.entrega.yml up --build
#
# Deja la interfaz en http://localhost:5173 y la API en http://localhost:3000,
# con el dataset `dev` ya sembrado. La interfaz es la puerta de entrada: habla
# con la API por el proxy de `/api` (nginx), así que el navegador solo ve un
# mismo origen. No hace falta Node ni pnpm en la máquina: solo Docker.
#
# Variables opcionales (con su valor por defecto):
#   EVENTIX_BIND=127.0.0.1     interfaz de publicación; 0.0.0.0 la expone a la red
#   EVENTIX_PORT=3000          puerto publicado de la API
#   EVENTIX_WEB_PORT=5173       puerto publicado de la interfaz web
#   EVENTIX_MONGO_PORT=27018   puerto publicado de MongoDB
#   EVENTIX_SEED=auto          auto (siembra si la base está vacía) | always | never
#   EVENTIX_SEED_SCALE=dev     escala del dataset: dev | full
#   EVENTIX_MONGO_WAIT_TIMEOUT_MS=120000  espera máxima por el primario (dentro del contenedor)

# El proyecto de Compose lleva su propio nombre para no chocar con el compose de
# desarrollo (`docker-compose.yml`), que vive en el mismo directorio: sin esto,
# los dos compartirían proyecto y el servicio `mongo` de uno recrearía el
# contenedor del otro.
name: eventix-entrega

services:
  mongo:
    image: mongo:7
    container_name: eventix-entrega-mongo
    # `--replSet` es obligatorio: las transacciones multi-documento del flujo de
    # compra (documento 04 §6) no funcionan contra un mongod standalone.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "${EVENTIX_BIND:-127.0.0.1}:${EVENTIX_MONGO_PORT:-27018}:27017"
    volumes:
      - entrega-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  # Inicializa el replica set. Es un servicio de un solo uso: termina con
  # código 0 y se queda ahí.
  #
  # El miembro del replica set se registra como `mongo:27017` (y no como
  # `localhost:27017`) porque la API corre en otro contenedor de la misma red:
  # el driver resuelve el nombre que el replica set publica.
  mongo-init:
    image: mongo:7
    container_name: eventix-entrega-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - mongosh
      - --host
      - mongo:27017
      - --quiet
      - --eval
      - |
        try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventix-entrega-api
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: "3000"
      MONGODB_URI: mongodb://mongo:27017/eventix?replicaSet=rs0
      MONGODB_DB: eventix
      LOG_LEVEL: info
      # La siembra corre dentro del contenedor antes de que la API escuche.
      SEED: "${EVENTIX_SEED:-auto}"
      SEED_SCALE: "${EVENTIX_SEED_SCALE:-dev}"
      # La espera por el primario, dentro del contenedor. El shell usa
      # EVENTIX_MONGO_WAIT_TIMEOUT_MS; dentro del contenedor la variable se
      # llama MONGO_WAIT_TIMEOUT_MS, que es la que lee el script de preparación.
      MONGO_WAIT_TIMEOUT_MS: "${EVENTIX_MONGO_WAIT_TIMEOUT_MS:-120000}"
    ports:
      - "${EVENTIX_BIND:-127.0.0.1}:${EVENTIX_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    # Sin `restart`: si la preparación de la base falla, el contenedor tiene que
    # quedar caído y visible, con el error en sus logs. Con una política de
    # reinicio, un error de configuración se convierte en un bucle infinito que
    # parece que la API está arrancada.

  # La interfaz web: nginx sirve la SPA compilada y hace proxy de `/api` hacia
  # el servicio `api` de arriba. Es la puerta de entrada de la demo.
  #
  # La dirección del backend se resuelve **en cada petición** (el `resolver`
  # interno de Docker), no al arrancar nginx: si el contenedor de la API se
  # reinicia y cambia de IP, el proxy sigue funcionando.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: eventix-entrega-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${EVENTIX_BIND:-127.0.0.1}:${EVENTIX_WEB_PORT:-5173}:80"
    healthcheck:
      # El healthcheck va **a través del proxy**: si responde, están vivos el
      # nginx, la API y MongoDB, que es exactamente la cadena que la demo
      # necesita.
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/api/health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    # Sin `restart`, por la misma razón que la API: una configuración de nginx
    # rota tiene que quedar a la vista, no reiniciarse en loop.

volumes:
  entrega-mongo-data:
    name: eventix-entrega-mongo-data
