# Configuración de nginx para la entrega de la interfaz web de Eventix.
#
# Hace dos cosas, y las dos importan para la demo:
#
# - **Sirve la SPA con su _fallback_**: cualquier ruta de la aplicación
#   (`/catalogo`, `/contrato`, `/gestion/eventos/…`) devuelve el `index.html`
#   para que el enrutador del navegador resuelva. Sin esto, recargar una
#   pantalla en la sala mostraría un 404 de nginx en vez de la pantalla.
# - **Hace proxy de `/api` hacia la API**: el navegador nunca hace una
#   petición a otro origen, así que no hace falta CORS y la API no recibe ni
#   un solo cambio de configuración (specs S3 y S5).

server {
    listen 80;
    server_name _;

    # La cabecera `Server` no anuncia la versión: es información que no hace
    # falta darle y que no cuesta callar.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Los cuerpos de la interfaz son pequeños (una compra o una edición), pero
    # el límite por defecto de nginx (1 MB) se deja explícito para que nadie
    # lo descubra por un 413 en la sala.
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # --- La API ---
    #
    # El destino se resuelve **en cada petición**, con el resolver interno de
    # Docker: si el contenedor de la API se reinicia y cambia de dirección,
    # nginx no se queda con la vieja. Resolver el nombre en el arranque
    # (un `proxy_pass http://api:3000` sin variables) dejaría el proxy
    # apuntando a una IP que ya no existe.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api {
        set $destino_api "http://api:3000";

        # `$request_uri` es la ruta original **con** la query: el prefijo
        # `/api` viaja tal cual, porque es el que la API espera.
        proxy_pass $destino_api$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # --- La SPA ---
    #
    # `try_files` con el `index.html` al final es el _fallback_: primero
    # intenta el archivo exacto, después el directorio, y si no existe
    # ninguno, devuelve la aplicación para que el enrutador del navegador
    # decida qué pantalla es.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan el hash de su contenido en el nombre, así que se
    # pueden cachear para siempre: si cambia el contenido, cambia el nombre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El `index.html` es el que apunta a los assets: no se cachea, para que
    # una entrega nueva se vea sin pedirle al navegador que la olvide.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
