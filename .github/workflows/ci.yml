name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancela ejecuciones anteriores del mismo ref cuando hay pushes nuevos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/eventix_test?replicaSet=rs0
      MONGODB_DB: eventix_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6

      - name: Instalar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # MongoDB 7.x con replica set: el flujo de compra usa transacciones
      # multi-documento, que no existen contra un mongod standalone. Por eso no se
      # usa un service container (GitHub Actions no permite sobrescribir su comando)
      # sino un contenedor arrancado desde el step, igual que en local.
      - name: Levantar MongoDB 7.x (replica set rs0)
        run: |
          docker run -d --name eventix-mongo-ci -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          pnpm --filter @eventix/api mongo:init

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test
