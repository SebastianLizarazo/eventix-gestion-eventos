name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancela ejecuciones anteriores del mismo ref cuando hay pushes nuevos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest

    # MongoDB 7.x como replica set de un solo nodo: es el mismo requisito que el
    # entorno local (docker-compose.yml) porque el flujo de compra usa transacciones
    # multi-documento, que no existen contra un mongod standalone.
    # Hoy la suite es unitaria, pero desde H2 hay tests de integración contra la base.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"localhost:27017\"}]}) }; if (!db.hello().isWritablePrimary) { quit(1) }'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/eventix_test?replicaSet=rs0
      MONGODB_DB: eventix_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test
